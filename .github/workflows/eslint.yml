name: ESLint

on:
  pull_request:
    branches-ignore:
      - 2.*
      - 3.*
      - 4.*

jobs:
  linter:
    name: Ensure the code format on the changed files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получить всю историю для всех веток и тегов

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify the changed files
        run: |
          echo "Base ref: $GITHUB_BASE_REF"
          echo "Head ref: $GITHUB_HEAD_REF"
          echo "Head SHA: $GITHUB_SHA"
          
          # Получить измененные файлы с использованием payload события GitHub (более надежно)
          if [ -n "$GITHUB_BASE_REF" ]; then
            echo "Getting changed files from PR..."
            # Для pull requests используем event payload или git diff с merge base
            git fetch origin $GITHUB_BASE_REF --depth=1
            CHANGED_FILES=$(git diff --name-only --diff-filter d origin/$GITHUB_BASE_REF...HEAD | grep -E '.*\.[jt]sx?$' || true)
          else
            # Для push событий сравниваем с предыдущим коммитом
            CHANGED_FILES=$(git diff --name-only --diff-filter d HEAD~1...HEAD | grep -E '.*\.[jt]sx?$' || true)
          fi
          
          echo "Changed files:"
          echo "${CHANGED_FILES:-No JavaScript/TypeScript files changed}"
          
          # Если нет измененных релевантных файлов, пропускаем ESLint
          if [ -z "$CHANGED_FILES" ]; then
            echo "No JavaScript/TypeScript files to lint."
            exit 0
          fi
          
          echo "Installing dependencies"
          yarn
          echo "Running eslint on the changed files"
          npx eslint $CHANGED_FILES
